name: Deploy Agap Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-agap-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Agap Production VM
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Deploy Agap Production Environment
        run: |
          set -e
          echo "===================================================="
          echo "🚀 Deploying AGAP to Production (Self-Hosted)..."
          echo "===================================================="
          cd /mnt/agap-portal

          # 1. Pull latest production branch
          git fetch origin
          git checkout -B production -f origin/production
          echo "Current commit:"
          git log -1 --format="%h - %s (%an, %cd)"

          # 2. Build Frontend
          echo "--> Ensuring clean permissions..."
          sudo chown -R Administrator1:Administrator1 /mnt/agap-portal
          sudo rm -rf dist frontend/dist
          echo "--> Building frontend client..."
          export VITE_BASE_PATH="/insighted/AGAP-Portal/"
          export VITE_API_URL="/insighted/AGAP-Portal"
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build --prefix frontend

          # 3. Sync frontend static files to Nginx web root and dist
          echo "--> Syncing frontend assets..."
          mkdir -p dist
          cp -r frontend/dist/* dist/ 2>/dev/null || true
          sudo mkdir -p /var/www/html/InsightED-AGAP/agap-portal/dist
          sudo cp -r frontend/dist/* /var/www/html/InsightED-AGAP/agap-portal/dist/ 2>/dev/null || true
          sudo chmod -R a+rX /mnt/agap-portal/frontend/dist /mnt/agap-portal/dist /var/www/html/InsightED-AGAP/agap-portal/dist
          sudo chown -R Administrator1:Administrator1 /mnt/agap-portal /var/www/html/InsightED-AGAP/agap-portal

          # 4. Install backend dependencies & build
          echo "--> Installing backend dependencies and compiling..."
          cd backend
          mkdir -p logs
          npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
          npx prisma generate --schema=database/schema.prisma
          npm run build

          # 5. Restart PM2
          echo "--> Restarting PM2 service..."
          cd /mnt/agap-portal
          pm2 restart ecosystem.agap-portal.config.cjs --update-env || pm2 start ecosystem.agap-portal.config.cjs
          pm2 save

          # 6. Verify health
          echo "--> Verifying backend health..."
          sleep 6
          curl -s -i http://127.0.0.1:5070/ || curl -s -i http://127.0.0.1:5070/api/ || true
          echo "✅ AGAP Production deployment completed successfully!"
